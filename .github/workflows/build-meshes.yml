name: Build mesh bundle

# Generate the optimized Draco GLB meshes ONCE in CI and publish them as a
# GitHub Release asset, so end users never run the (slow) conversion. The bundle
# is keyed to the description submodule commits; run.sh / scripts/mesh-bundle.sh
# download the matching asset.
#
# Runs on a host runner (not a container) so we can free disk: the description
# meshes decompress to ~17 GiB of COLLADA, which overflows the small container
# disk.
on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - deps/abb_robot_descriptions
      - deps/fanuc_robot_descriptions
      - deps/kuka_robot_descriptions
      - deps/ur_robot_descriptions
      - deps/yaskawa_robot_descriptions
      - deps/ros2_robotiq_gripper
      - deps/app-robot-description-setup-assistant
      - .github/workflows/build-meshes.yml

jobs:
  build-bundle:
    runs-on: ubuntu-22.04 # Humble targets 22.04
    permissions:
      contents: write # create/upload the release asset
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Re-materialize gzipped .dae meshes (daegz filter)
        shell: bash
        run: |
          # The description repos store *.dae gzip-compressed behind a custom
          # 'daegz' git filter (clean: gzip -9, smudge: gzip -d). CI has no such
          # filter configured, so checkout leaves the gzipped blobs in the tree
          # and the converter sees non-XML. Register the filter and re-checkout
          # the affected submodules so the .dae decompress to real COLLADA.
          git config --global filter.daegz.clean  "gzip -n -9"
          git config --global filter.daegz.smudge "gzip -d"
          git config --global filter.daegz.required true
          for s in abb fanuc kuka yaskawa; do
            d="deps/${s}_robot_descriptions"
            [ -d "$d" ] || continue
            git -C "$d" config filter.daegz.clean  "gzip -n -9"
            git -C "$d" config filter.daegz.smudge "gzip -d"
            git -C "$d" config filter.daegz.required true
            find "$d" -name '*.dae' -delete
            git -C "$d" checkout -- .
          done
          # Sanity: a smudged .dae must be XML, not gzip. Pipe-free to avoid
          # SIGPIPE under 'set -o pipefail' (find -quit / head into a var).
          f="$(find deps/abb_robot_descriptions -name '*.dae' -print -quit)"
          case "$(head -c 16 "$f")" in
            *'<?xml'*) echo "daegz OK: $f decompressed" ;;
            *) echo "daegz FAILED: $f still not XML"; exit 1 ;;
          esac

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install converter toolchain
        shell: bash
        run: |
          # Node 18 for the gltf-transform CLI (Draco); Python deps for the converter.
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y --no-install-recommends nodejs
          sudo npm install -g @gltf-transform/cli
          pip3 install --user trimesh pycollada numpy

      - name: Build description packages (ament share dirs for the converter)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          rosdep update || true
          rosdep install --from-paths deps --ignore-src -y -r || true
          # --symlink-install so the 17 GiB of meshes are NOT copied into install/.
          colcon build --symlink-install --parallel-workers 2 \
            --packages-select \
              abb_robot_descriptions fanuc_robot_descriptions \
              kuka_robot_descriptions ur_description \
              yaskawa_robot_descriptions robotiq_description

      - name: Generate optimized GLBs
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 deps/app-robot-description-setup-assistant/backend/scripts/optimize_meshes.py \
            --out meshes-opt

      - name: Pack bundle
        id: pack
        shell: bash
        run: |
          chmod +x scripts/mesh-bundle.sh
          HASH="$(scripts/mesh-bundle.sh hash)"
          scripts/mesh-bundle.sh pack
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Publish to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: meshes-${{ steps.pack.outputs.hash }}
          name: Mesh bundle meshes-${{ steps.pack.outputs.hash }}
          body: >
            Prebuilt Draco GLB mesh bundle for the web viewer, generated from the
            robot description submodules. Downloaded automatically by run.sh /
            scripts/mesh-bundle.sh — not for manual use.
          files: meshes-opt.tar.gz
          fail_on_unmatched_files: true
