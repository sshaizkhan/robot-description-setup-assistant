# Universal Robots arms.
# Each entry: type=arm, and `attach.tool_frame` is the link an end-effector
# mounts onto (UR descriptions expose "tool0").
robots:
  ur3:
    type: arm
    display_name: "UR3"
    description: "Compact 6-axis collaborative robot ideal for light assembly tasks"
    image_path: "resources/graphics/universal_robots/ur3.png"
    urdf_package: "ur_description"
    urdf_path: "urdf/ur.urdf.xacro"
    xacro_args: "name:=ur3_robot ur_type:=ur3"
    category: "universal_robots"
    attach:
      tool_frame: "tool0"
    specifications:
      degrees_of_freedom: 6
      payload_kg: 3.0
      reach_mm: 500
      weight_kg: 11.0
      repeatability_mm: 0.1
      max_speed_ms: 1.0
      mounting: ["floor", "ceiling", "wall"]
      safety_certified: true
      collaborative: true
    required_packages:
      - "ur_description"
      - "ur_msgs"
    optional_packages:
      - "ur_moveit_config"
      - "ur_gazebo"
    tags: ["collaborative", "small", "light_payload", "compact"]

