# KUKA arms.
robots:
  kr6_r700_sixx:
    type: arm
    display_name: "KUKA KR6 R700 Sixx"
    description: "Compact industrial robot with high precision and speed"
    image_path: "resources/graphics/kuka/kr6_r700_sixx.png"
    urdf_package: "kuka_robot_descriptions"
    urdf_path: "urdf/kuka.urdf.xacro"
    xacro_args: "name:=kr6_r700_sixx kuka_type:=kr6_r700_sixx"
    category: "kuka"
    attach:
      tool_frame: "tool0"
    specifications:
      degrees_of_freedom: 6
      payload_kg: 6.0
      reach_mm: 900
      weight_kg: 20.0
      repeatability_mm: 0.05
      max_speed_ms: 2.0
      mounting: ["floor", "ceiling", "wall"]
      safety_certified: true
      collaborative: false
    required_packages:
      - "kuka_robot_descriptions"
    optional_packages:
      - "kuka_moveit_config"
      - "kuka_gazebo"
    tags: ["industrial", "compact", "high_precision", "fast"]

