# Base, cross-platform compose config.
# OS-specific bits live in docker-compose.linux.yml / docker-compose.mac.yml,
# selected automatically into docker-compose.override.yml by select-os.bash.
services:
  rds_ws:
    container_name: r-d-s-a
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: "bot"
        PASSWORD: ""
    environment:
      - ROS_DOMAIN_ID=42
      - CONTAINER_NAME=r-d-s-a
      - TZ=America/New_York
      - QT_X11_NO_MITSHM=1
    volumes:
      - ${HOME}/.ssh:/home/bot/.ssh:ro
      # Mount the whole ROS workspace root. .devcontainer lives at
      # rds_ws/src/robot-description-setup-assistant/.devcontainer, so ../../../ = rds_ws.
      - ../../../:/home/bot/rds_ws/
    # Host networking on BOTH OSes (matches the original Linux runArgs --network=host).
    # macOS: requires Docker Desktop 4.34+, signed-in account, the host-networking
    # toggle enabled, and Enhanced Container Isolation OFF. L4 (TCP/UDP) only.
    network_mode: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    stdin_open: true
    tty: true
    working_dir: /home/bot
    # Lifecycle scripts run via devcontainer.json postCreate/postAttach hooks.
    command: tail -f /dev/null

  # Browser-based GUI (http://localhost:8080). Works on Linux and macOS
  # without a host X server. GPU bits for it are added in the Linux override.