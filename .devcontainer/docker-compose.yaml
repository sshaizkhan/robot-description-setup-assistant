# Base, cross-platform compose config.
# OS-specific bits live in docker-compose.linux.yml / docker-compose.mac.yml,
# selected automatically into docker-compose.override.yml by select-os.bash.
services:
  rds_ws:
    container_name: r-d-s-a
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: "bot"
        PASSWORD: ""
    environment:
      - ROS_DOMAIN_ID=42
      - CONTAINER_NAME=r-d-s-a
      - TZ=America/New_York
      - DISPLAY=novnc:0.0
      - QT_X11_NO_MITSHM=1
    volumes:
      - ${HOME}/.ssh:/home/bot/.ssh:ro
    networks:
      - x11
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    stdin_open: true
    tty: true
    working_dir: /home/bot
    # Lifecycle scripts run via devcontainer.json postCreate/postAttach hooks.
    command: tail -f /dev/null

  # Browser-based GUI (http://localhost:8080). Works on Linux and macOS
  # without a host X server. GPU bits for it are added in the Linux override.
  novnc:
    image: theasp/novnc:latest
    environment:
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
    ports:
      - "0.0.0.0:8080:8080"
    networks:
      - x11
    restart: on-failure

networks:
  x11:
    driver: bridge
